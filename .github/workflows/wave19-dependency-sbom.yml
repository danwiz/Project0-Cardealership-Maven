name: Wave19 Dependency Tree and CycloneDX Inventory

# Inspection only. No token elevation, credentials, NVD keys or release operations.
on:
  pull_request:
    branches:
      - integration/stage28-controlled-maven-port-20261105

permissions:
  contents: read

concurrency:
  group: wave19-sbom-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dependency-inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head without persisted GitHub credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Set up Java 17 and Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate dependency tree and CycloneDX BOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wave19-sbom
          mvn --batch-mode --no-transfer-progress -DskipTests \
            org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
            -DoutputType=json -DoutputFile=wave19-sbom/dependency-tree.json
          mvn --batch-mode --no-transfer-progress -DskipTests \
            -DoutputFormat=all -DincludeTestScope=true -Dcyclonedx.skipAttach=true \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

      - name: Require complete inventory structure and source SHA
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 ci/wave19_verify_sbom.py
          cd wave19-sbom
          sha256sum dependency-tree.json inventory-check.json > SHA256SUMS.txt

      - name: Preserve inventory and fail-closed diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave19-inventory-${{ github.event.pull_request.head.sha }}
          path: |
            wave19-sbom/
            target/bom.json
            target/bom.xml
          if-no-files-found: warn
          retention-days: 14
