name: Wave21 PostgreSQL16 Dealership Purchase Failover Integration

on:
  pull_request:
    branches:
      - integration/stage28-controlled-maven-port-20261105

permissions:
  contents: read

concurrency:
  group: wave21-dealership-ha-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dealership-recovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare Java17 and Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Confirm immutable test checkout and isolated runner
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          docker info >/dev/null
          bash -n ci/wave21_pg16_dealership_failover.sh
      - name: Test real dealership v5 purchase, physical promotion, idempotent replay
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p wave21-ha
          bash ci/wave21_pg16_dealership_failover.sh 2>&1 | tee wave21-ha/run.log
      - name: Preserve exact-sha recovery diagnostics even if failed
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave21-dealership-ha-${{ github.event.pull_request.head.sha }}
          path: wave21-ha/
          if-no-files-found: warn
          retention-days: 14
