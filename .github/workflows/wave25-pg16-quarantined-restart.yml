name: Wave25 Quarantined Former Primary Restart After PG16 Promotion

on:
  pull_request:
    branches:
      - integration/stage28-controlled-maven-port-20261105

permissions:
  contents: read

concurrency:
  group: wave25-old-primary-quarantine-${{ github.event.pull_request.number }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  quarantined-restart:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout exact PR head without stored credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Java17 and Maven for actual dealership state
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify immutable checkout and disposable Docker fencing syntax
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          docker info >/dev/null
          bash -n ci/wave25_pg16_fenced_restart_lab.sh
      - name: Isolate old primary, promote standby, quarantine restart, verify safe stop
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p wave25-restart
          bash ci/wave25_pg16_fenced_restart_lab.sh 2>&1 | tee wave25-restart/run.log
      - name: Save exact-SHA machine-readable quarantine and recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wave25-quarantine-${{ github.event.pull_request.head.sha }}
          path: wave25-restart/
          if-no-files-found: warn
          retention-days: 14
